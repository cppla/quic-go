on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  govulncheck:
    if: github.repository == 'quic-go/quic-go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
